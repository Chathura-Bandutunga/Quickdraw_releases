title: Quickdraw
description: Drag-and-drop lab diagrams — FPGA/DSP, fibre optics, free-space optics, analog/RF.
repo: https://github.com/Chathura-Bandutunga/Quickdraw_releases

# No theme: the layout in _layouts/ is the whole site. docs/ is regenerated by
# the release exporter and cannot hold site config, so everything lives here and
# site/build.sh merges the two.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - README.md
  - build.sh
